---
# Déploiement LWS : synchronise le dépôt vers public_html/sugu.
# cPanel > Git Version Control > "Update from Remote" puis "Deploy HEAD Commit".
# Le dépôt est cloné dans ~/repositories/sugu ; le site tourne dans
# ~/public_html/sugu (racine du sous-domaine -> public_html/sugu/public).
#
# Protégés à chaque synchro (jamais écrasés) : .env, storage (uploads),
# vendor, node_modules.
deployment:
  tasks:
    - export SRC="$PWD" DST="$(dirname $PWD)/public_html/sugu"
    - /bin/echo "== Synchro $SRC vers $DST =="
    - "php -r \"exit(version_compare(PHP_VERSION, '8.5.0', '<') ? 1 : 0);\" || (/bin/echo 'ERREUR : PHP 8.5 requis. Change la version dans cPanel.' && exit 1)"
    - /bin/mkdir -p "$DST"
    - rsync -a --delete --exclude=.git --exclude=.env --exclude=storage --exclude=vendor --exclude=node_modules --exclude=mobile/node_modules --exclude=.expo --exclude=.opencode "$SRC/" "$DST/"
    - cd "$DST" && php composer.phar install --no-dev --optimize-autoloader --no-interaction || composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$DST" && (/bin/test -f .env || /bin/cp .env.example .env)
    - cd "$DST" && (grep -q "^APP_KEY=.\+" .env || php artisan key:generate --force --no-interaction)
    - cd "$DST" && php artisan storage:link || /bin/true
    - cd "$DST" && php artisan migrate --force
    - cd "$DST" && php artisan config:cache
    - cd "$DST" && php artisan route:cache
    - cd "$DST" && php artisan view:cache
    - /bin/echo "== Déploiement terminé =="
